name: Go CLI CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-cli.yaml
      - .golangci.yml
      - build/golangci-lint/**
      - cli/**
      - sdk/go/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-cli.yaml
      - .golangci.yml
      - build/golangci-lint/**
      - cli/**
      - sdk/go/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            build/golangci-lint/go.sum

      - name: golangci-lint
        working-directory: cli
        run: make golangci-lint

      - name: Check licenses
        working-directory: cli
        run: make check-licenses

      - name: Check NOTICE
        working-directory: cli
        run: make check-notice

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test
        working-directory: cli
        run: make test

      - name: Build
        working-directory: cli
        run: make build
